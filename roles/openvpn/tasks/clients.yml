---
- name: issue client certificates
  ansible.builtin.command:
    cmd: "/usr/share/easy-rsa/easyrsa --batch build-client-full {{ item }} nopass"
    chdir: "{{ openvpn_easyrsa_dir }}"
    creates: "{{ openvpn_easyrsa_dir }}/pki/issued/{{ item }}.crt"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_KEY_SIZE: "{{ openvpn_rsa_key_size }}"
  loop: "{{ openvpn_clients }}"
  when: not ansible_check_mode or openvpn__bin.stat.exists

# read the index once so revocation only touches certs that are still valid (a
# line starting with V), which keeps re-runs idempotent — easyrsa errors when
# asked to revoke an already-revoked cert.
- name: read the certificate index
  ansible.builtin.slurp:
    src: "{{ openvpn_easyrsa_dir }}/pki/index.txt"
  register: openvpn__index
  when:
    - openvpn_revoke_these_certs | length > 0
    - not ansible_check_mode or openvpn__bin.stat.exists
  changed_when: false

- name: revoke client certificates
  ansible.builtin.command:
    cmd: "/usr/share/easy-rsa/easyrsa --batch revoke {{ item }}"
    chdir: "{{ openvpn_easyrsa_dir }}"
  environment:
    EASYRSA_BATCH: "1"
  loop: "{{ openvpn_revoke_these_certs }}"
  when:
    - openvpn_revoke_these_certs | length > 0
    - not ansible_check_mode or openvpn__bin.stat.exists
    - openvpn__index.content | default('') | b64decode | regex_search('(?m)^V.*/CN=' + (item | regex_escape) + '$')
  changed_when: true
  notify: restart openvpn
