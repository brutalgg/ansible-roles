---
# out-of-band upgrade dispatcher. NOT imported by main.yml — a provisioning run
# must never silently upgrade the runner (docs/STANDARDS.md §2.1). the consumer
# runs it deliberately after bumping act_runner_version, e.g.
#   ansible.builtin.import_role: { name: act_runner, tasks_from: update.yml }
# native upgrades the binary in place; container pulls the new image and recreates.
- name: update act runner
  ansible.builtin.include_tasks: "update-{{ act_runner_install_mode }}.yml"
