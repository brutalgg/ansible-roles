---
# per-entry: nfs_mount__entry is {src, path, opts?} from the nfs_mounts loop.

# the mountpoint only needs to exist before the first mount — once the share
# is mounted the path belongs to the remote fs, and enforcing a mode on it
# would fail (e.g. EROFS on a read-only share). check_mode: false — read-only
# probe that must also run in dry runs so the guarded task can evaluate.
- name: check whether the share is already mounted
  ansible.builtin.command: mountpoint -q {{ nfs_mount__entry.path }}
  register: nfs_mount__mounted
  changed_when: false
  failed_when: false
  check_mode: false

- name: create mountpoint
  ansible.builtin.file:
    path: "{{ nfs_mount__entry.path }}"
    state: directory
    mode: "0755"
  when: nfs_mount__mounted.rc != 0

- name: mount nfs share
  ansible.posix.mount:
    path: "{{ nfs_mount__entry.path }}"
    src: "{{ nfs_mount__entry.src }}"
    fstype: nfs
    opts: "{{ nfs_mount__entry.opts | default(nfs_mount_default_opts) }}"
    state: mounted
  register: nfs_mount__result

# a changed fstab line on an already mounted share is not applied live: the
# module's `mount -o remount` keeps the old nfs source, and the fstab-generated
# systemd units still carry the old line until a daemon-reload. so cycle it:
# reload first, so an automount can't re-trigger on the old source between the
# unmount and the mount. the unmount fails (loudly) if something holds the path
# — a stacked mount or an open file — which beats leaving the old share in place.
- name: reload systemd so the fstab-generated mount units follow the new line
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - nfs_mount__result is changed
    - nfs_mount__mounted.rc == 0

- name: unmount the share to apply the changed line
  ansible.posix.mount:
    path: "{{ nfs_mount__entry.path }}"
    state: unmounted
  when:
    - nfs_mount__result is changed
    - nfs_mount__mounted.rc == 0

- name: mount the share again from the new line
  ansible.posix.mount:
    path: "{{ nfs_mount__entry.path }}"
    src: "{{ nfs_mount__entry.src }}"
    fstype: nfs
    opts: "{{ nfs_mount__entry.opts | default(nfs_mount_default_opts) }}"
    state: mounted
  when:
    - nfs_mount__result is changed
    - nfs_mount__mounted.rc == 0
