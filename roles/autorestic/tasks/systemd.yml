---
- name: deploy backup systemd service
  ansible.builtin.template:
    src: backup.service.j2
    dest: /etc/systemd/system/backup.service
    owner: root
    group: root
    mode: "0644"
  notify: restart backup timer

- name: deploy backup systemd timer
  ansible.builtin.template:
    src: backup.timer.j2
    dest: /etc/systemd/system/backup.timer
    owner: root
    group: root
    mode: "0644"
  register: autorestic_timer_unit
  notify: restart backup timer

- name: reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

# under --check the template above doesn't write the unit, so on a first run
# systemd has nothing to enable; the real run and re-runs still validate it
- name: enable and start backup timer
  ansible.builtin.systemd:
    name: backup.timer
    enabled: true
    state: started
  when: not (ansible_check_mode and autorestic_timer_unit is changed)
